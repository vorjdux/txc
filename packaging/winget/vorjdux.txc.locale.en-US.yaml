ShortDescription: Offline text utilities and an encrypted secrets vault for the terminal
Description: |-
  Everything the online text tool sites do, done locally: your text never
  leaves the machine, there is no network call, and there is nothing to paste
  into a web form. Over a hundred operations covering case conversion,
  encoding, hashing, line editing, format conversion, inspection and
  generators, usable as arguments, over a pipe, or through an interactive
  terminal interface. It also keeps an encrypted local vault for passwords,
  payment cards, API keys, notes and other secrets, built on the age format,
  with secrets copied to a clipboard that clears itself.
