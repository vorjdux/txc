# cargo audit reads Cargo.lock, which lists the optional dependencies of
# every crate txc uses, compiled or not.

[advisories]
ignore = [
    # RUSTSEC-2023-0071, the Marvin timing attack on the rsa crate. rsa is an
    # optional dependency of ssh-key that txc never enables: txc only makes
    # Ed25519 keys and certificates (src/vault/sshca.rs, ssh-key with the
    # "ed25519" feature alone), and `cargo tree -i rsa --target all` finds
    # nothing that builds it. Remove this line if RSA is ever enabled.
    "RUSTSEC-2023-0071",
]
